[project]
name = "vazante"
version = "0.1.0"
description = "VAZANTE — a finite principal desk that buys whole broken Brazilian FIDC carteiras for one cash price and resells them in three pieces. Detection (CVM), Oracle (E/T/C/D/R verification), buyer boxes, economics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Sutphin Ltd. Confidential" }
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "pyarrow>=16",
  "duckdb>=1.0",
  "requests>=2.31",
  "httpx>=0.27",
  "lxml>=5",
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "pyyaml>=6",
  "tqdm>=4.66",
  "networkx>=3.3",
  "python-dateutil>=2.9",
  "xmltodict>=0.13",
  "typer>=0.12",
  "rich>=13",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
vazante = "vazante.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vazante"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
